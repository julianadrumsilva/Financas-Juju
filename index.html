<style>
:root{
  --paper:#F4F1FA; --card:#FFFFFF; --ink:#261B3A; --soft:#766C8E; --line:#E3DDEF; --well:#F1ECF8;
  --violet:#7B5CF0; --violet-bg:#ECE6FF; --rose:#F0598F; --mint:#22A57A; --mint-bg:#DDF4EA;
  --sun:#E4A91A; --sun-bg:#FCF1D4; --bad:#E0445E; --bad-bg:#FCE2E7;
  --amber:#E2812A; --amber-bg:#FCEADA; --wine:#B3447A; --wine-bg:#F8E3EE;
  --hero:linear-gradient(135deg,#6B4BE8 0%,#A24FD8 55%,#EE5F93 100%);
  --hero-berga:linear-gradient(135deg,#E2812A 0%,#E4572B 60%,#E4A91A 100%);
  --hero-brecho:linear-gradient(135deg,#B3447A 0%,#8E3466 60%,#D8678F 100%);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15111F; --card:#201A2E; --ink:#F0ECF8; --soft:#A79DC0; --line:#342B48; --well:#2A2340;
  --violet:#A48BFF; --violet-bg:#2E2550; --rose:#FF7BA7; --mint:#4FD1A0; --mint-bg:#163428;
  --sun:#F2C050; --sun-bg:#3A2E12; --bad:#FF7A90; --bad-bg:#3E1C25;
  --amber:#F2A05C; --amber-bg:#3A2712; --wine:#E27FB0; --wine-bg:#3A2130;}}
:root[data-theme="dark"]{
  --paper:#15111F; --card:#201A2E; --ink:#F0ECF8; --soft:#A79DC0; --line:#342B48; --well:#2A2340;
  --violet:#A48BFF; --violet-bg:#2E2550; --rose:#FF7BA7; --mint:#4FD1A0; --mint-bg:#163428;
  --sun:#F2C050; --sun-bg:#3A2E12; --bad:#FF7A90; --bad-bg:#3E1C25;
  --amber:#F2A05C; --amber-bg:#3A2712; --wine:#E27FB0; --wine-bg:#3A2130;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:0 16px 120px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em}
h1{font-size:24px;font-weight:800}
h2{font-size:18px;font-weight:700;margin:24px 0 10px}
.muted{color:var(--soft);font-size:13px}
.num{font-variant-numeric:tabular-nums}
header.top{padding:18px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hdr-r{display:flex;align-items:center;gap:8px}
.save{font-size:12px;color:var(--soft);white-space:nowrap}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}

/* bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bn .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.bn button{border:0;background:transparent;color:var(--soft);font:600 11px var(--body);padding:6px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;opacity:.55}
nav.bn button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.bn button[aria-selected="true"]{color:var(--ink);opacity:1}
nav.bn button[aria-selected="true"] svg{stroke-width:2}
nav.bn button[aria-selected="true"]::after{content:"";position:absolute;top:0;left:50%;width:18px;height:3px;margin-left:-9px;border-radius:0 0 3px 3px;background:var(--violet)}

/* hero */
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero.berga{background:var(--hero-berga)}
.hero.brecho{background:var(--hero-brecho)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero small{opacity:.85;font-size:13px}
.hero .big{font-family:var(--display);font-size:clamp(34px,10vw,46px);font-weight:800;line-height:1.05;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.hbar{position:relative;z-index:1;display:flex;gap:3px;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.18);margin:2px 0 14px}
.hbar i{display:block;height:100%;border-radius:99px;min-width:6px}
.htiles{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ht{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:9px 12px}
.ht small{font-size:11px;opacity:.8}
.ht b{display:block;font-family:var(--display);font-size:16px;margin-top:2px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;margin-bottom:8px}
.tile b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .sub2{font-size:12px;color:var(--soft);margin-top:4px}

.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{flex:1;min-width:72px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--soft);font:600 12.5px var(--body);cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--violet-bg);color:var(--violet);border-color:var(--violet)}

.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.item .tx{flex:1;min-width:0;cursor:pointer}
.item .tx div{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.item .tx small{color:var(--soft);font-size:12.5px}
.item .val{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .check{width:30px;height:30px;border-radius:50%;border:2px solid var(--mint);background:transparent;display:grid;place-items:center;flex:none;cursor:pointer;color:var(--mint);font-size:15px}
.item .check.on{background:var(--mint);color:#fff}
.item.pago .tx div{text-decoration:line-through;opacity:.55}
.item.pago .val{text-decoration:line-through;opacity:.6}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--mint-bg);color:var(--mint)}.pill.warn{background:var(--sun-bg);color:var(--sun)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.btn{background:var(--violet);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:700 14px var(--body);cursor:pointer}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%;padding:13px}
.x{border:0;background:transparent;color:var(--soft);font-size:19px;cursor:pointer;border-radius:8px;padding:4px 7px}
.empty{color:var(--soft);font-size:14px;padding:10px 0;text-align:center}

/* contas em grade */
.ctgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ctcard{border-radius:18px;padding:14px;color:#fff;position:relative;cursor:pointer;min-height:90px;display:flex;flex-direction:column;justify-content:space-between}
.ctcard .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.ctcard .nm i{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.ctcard b{font-family:var(--display);font-size:18px;margin-top:8px}
.ctcard .ed{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.22);border:0;color:#fff;width:26px;height:26px;border-radius:8px;font-size:13px;cursor:pointer}

/* fatura/cartão card */
.fatcard{border-radius:20px;padding:16px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#4B2F8F 0%,#261B3A 55%,#1C1430 100%);margin-bottom:12px}
.fatcard .ft{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fatcard small{font-size:12px;opacity:.75}
.fatcard .fv{font-family:var(--display);font-size:clamp(26px,8vw,34px);font-weight:800;margin:2px 0 10px}
.fatcard .fchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fatcard .fchips div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 11px}
.fatcard .fchips b{display:block;font-family:var(--display);font-size:15px}
.fmini{display:flex;gap:6px;overflow-x:auto;margin:12px 0 2px;padding-bottom:2px}
.fmini button{border:0;background:rgba(255,255,255,.08);color:#fff;opacity:.7;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 10px;border-radius:10px;font:600 11px var(--body);flex:none;cursor:pointer}
.fmini button[aria-pressed="true"]{opacity:1;background:rgba(255,255,255,.22)}

.stamp{display:inline-block;border:1.5px dashed var(--mint);color:var(--mint);font-family:var(--display);font-weight:700;font-size:11px;padding:1px 8px;border-radius:6px;transform:rotate(-3deg);margin-left:6px}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(20,14,32,.5);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:24px}}
.sheet h3{margin-bottom:14px}
.f{display:block;font-size:13px;color:var(--soft);margin-bottom:12px}
.f input,.f select{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:500 16px var(--body);background:var(--well);color:var(--ink)}
.f.chk{display:flex;align-items:center;gap:10px;cursor:pointer}
.f.chk input{width:20px;height:20px;accent-color:var(--violet);margin:0;flex:none}
.bigval{font:800 30px var(--display)!important;text-align:center;padding:14px!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions{display:flex;gap:10px;margin-top:6px}
.sheet .actions .btn{flex:1}
.armed{color:#fff!important;background:var(--bad)!important;border-radius:10px!important;padding:6px 10px!important;font:700 13px var(--body)!important;border-color:var(--bad)!important}

#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .3s}

#fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--hero);color:#fff;font-size:30px;font-weight:300;box-shadow:0 10px 26px rgba(123,92,240,.45);cursor:pointer}
footer{color:var(--soft);font-size:12px;text-align:center;margin-top:28px}
@media (min-width:860px){
  main{max-width:900px}
  #t-inicio .tiles{grid-template-columns:repeat(3,1fr)}
  .ctgrid{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header class="top">
  <div><h1>Finanças Ju &amp; Bêrga</h1><div class="muted" id="hello">domingo, 18 de outubro</div></div>
  <div class="hdr-r"><span class="save" id="saveState"></span><button class="icon-btn" data-act="ajustes" aria-label="Ajustes">⚙️</button></div>
</header>

<div class="tab on" id="t-inicio"></div>
<div class="tab" id="t-gastos"></div>
<div class="tab" id="t-cartoes"></div>
<div class="tab" id="t-berga"></div>
<div class="tab" id="t-brecho"></div>

<footer>Pra planejar e acompanhar. Não é consultoria financeira.</footer>
</main>

<nav class="bn"><div class="in" role="tablist">
  <button role="tab" data-tab="inicio" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.8H9.2v5.8H5A1.5 1.5 0 0 1 3.5 19z"/></svg>Início</button>
  <button role="tab" data-tab="gastos" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-2.4-1.6L13.2 20.5 12 19.7l-1.2.8-2.4-1.6L6 20.5z"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/></svg>Gastos</button>
  <button role="tab" data-tab="cartoes" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.2"/><path d="M3 10h18M7 15h4"/></svg>Cartões</button>
  <button role="tab" data-tab="berga" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6-9 6-9-6z"/><path d="M7 12.5V17c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-4.5"/></svg>Bêrga</button>
  <button role="tab" data-tab="brecho" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1.5 12.5a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Brechó</button>
</div></nav>

<button id="fab" data-act="fab" aria-label="Adicionar">+</button>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<!-- ===== Login (Supabase) ===== -->
<div id="sbLogin" style="position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(20,18,30,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
  <form id="sbLoginForm" style="width:100%;max-width:360px;background:#fff;color:#261B3A;border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25)">
    <div style="font-size:22px;font-weight:800;margin-bottom:4px">Entrar</div>
    <div style="font-size:14px;color:#766C8E;margin-bottom:18px">Use o mesmo e-mail e senha de sempre.</div>
    <label style="display:block;font-size:13px;color:#766C8E;margin-bottom:12px">E-mail<input id="sbEmail" type="email" autocomplete="email" required style="display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid #E3DDEF;border-radius:10px;font-size:16px;box-sizing:border-box"></label>
    <label style="display:block;font-size:13px;color:#766C8E;margin-bottom:14px">Senha
      <span style="position:relative;display:block;margin-top:4px"><input id="sbSenha" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:11px 46px 11px 12px;border:1px solid #E3DDEF;border-radius:10px;font-size:16px;box-sizing:border-box">
      <button type="button" id="sbOlho" aria-label="Mostrar senha" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:#766C8E;cursor:pointer;display:grid;place-items:center">
        <svg id="sbOlhoIc" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#261B3A;margin-bottom:16px;cursor:pointer"><input id="sbLembrar" type="checkbox" checked style="width:20px;height:20px;accent-color:#7B5CF0;margin:0"> Lembrar de mim neste aparelho</label>
    <button type="submit" style="width:100%;padding:12px;border:0;border-radius:10px;background:#7B5CF0;color:#fff;font-size:16px;font-weight:600;cursor:pointer">Entrar</button>
    <div id="sbLoginErr" style="color:#E0445E;font-size:14px;margin-top:12px;min-height:20px"></div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script>
const SB_URL = "https://wubshdrlzkjfhfuaoqli.supabase.co";
const SB_KEY = "sb_publishable_56QPxZ8CXYr_yBiuyOG_GA_VIn9DG0A";
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
let SB_USER = null;
const sbReadyCallbacks = [];
function onSbReady(fn){ if(SB_USER) fn(SB_USER); else sbReadyCallbacks.push(fn); }
(function(){
  const box = document.getElementById('sbLogin');
  const form = document.getElementById('sbLoginForm');
  const err = document.getElementById('sbLoginErr');
  const em = document.getElementById('sbEmail'), pw = document.getElementById('sbSenha'), lemb = document.getElementById('sbLembrar');
  if(!sb){
    // Supabase não carregou (sem internet ou CDN bloqueado na hora). Mostra aviso em vez de travar a tela em branco.
    box.style.display = 'flex';
    err.textContent = 'Não consegui carregar o servidor. Verifica a internet e recarrega a página.';
    form.querySelectorAll('input,button').forEach(elz=>elz.disabled=true);
    window.sbMostrarLogin = ()=>{ box.style.display='flex'; };
    return;
  }
  try{ const salvo = localStorage.getItem('fin2-email'); if(salvo){ em.value = salvo; lemb.checked = true; } else if(localStorage.getItem('fin2-lembrar')==='0'){ lemb.checked = false; } }catch(e){}
  document.getElementById('sbOlho').addEventListener('click', ()=>{
    const ver = pw.type === 'password'; pw.type = ver ? 'text' : 'password';
    document.getElementById('sbOlhoIc').innerHTML = ver
      ? '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
      : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  });
  try{ if(localStorage.getItem('fin2-lembrar')==='0' && !sessionStorage.getItem('fin2-aberto')){ sb.auth.signOut({scope:'local'}); } sessionStorage.setItem('fin2-aberto','1'); }catch(e){}
  function ready(user){
    if(SB_USER && !SB_USER.offline) return;
    const eraOff = SB_USER && SB_USER.offline;
    SB_USER = user; box.style.display = 'none';
    if(eraOff){ window.aoRelogar && window.aoRelogar(user); return; }
    sbReadyCallbacks.splice(0).forEach(fn=>fn(user));
  }
  form.addEventListener('submit', async e=>{
    e.preventDefault(); err.textContent = 'Entrando…';
    const { data, error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if(error){ err.textContent = error.message.includes('Invalid') ? 'E-mail ou senha incorretos.' : 'Não deu pra entrar: ' + error.message; return; }
    try{ if(lemb.checked){ localStorage.setItem('fin2-email', em.value.trim()); localStorage.setItem('fin2-lembrar','1'); } else { localStorage.removeItem('fin2-email'); localStorage.setItem('fin2-lembrar','0'); } }catch(e){}
    err.textContent = ''; try{ localStorage.setItem('fin2-uid', data.user.id); }catch(e){} ready(data.user);
  });
  const semNet = ()=>{ try{ const u = localStorage.getItem('fin2-uid'); if(u && !navigator.onLine){ ready({ id:u, offline:true }); return true; } }catch(e){} return false; };
  window.sbMostrarLogin = ()=>{ box.style.display = 'flex'; };
  sb.auth.getSession().then(({ data })=>{
    if(data.session){ try{ localStorage.setItem('fin2-uid', data.session.user.id); }catch(e){} ready(data.session.user); }
    else if(!semNet()) box.style.display = 'flex';
  }).catch(()=>{ if(!semNet()) box.style.display = 'flex'; });
})();
</script>

<script>
/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const num=v=>{let t=String(v??"").replace(/[R$\s]/g,"");if(t.includes(","))t=t.replace(/\./g,"").replace(",",".");const n=parseFloat(t);return isFinite(n)?n:0};
const inV=v=>(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const inV0=v=>+v?inV(v):"";
const fmt=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const dBR=d=>(d||"").split("-").reverse().slice(0,2).join("/");
const hoje=new Date(), HOJE=hoje.getFullYear()+"-"+String(hoje.getMonth()+1).padStart(2,"0")+"-"+String(hoje.getDate()).padStart(2,"0"), MES_HOJE=HOJE.slice(0,7);
const shiftM=(k,n)=>{const[y,m]=k.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const mfull=k=>{const[y,m]=k.split("-");const t=new Date(+y,+m-1,1).toLocaleDateString("pt-BR",{month:"long"});return t[0].toUpperCase()+t.slice(1)+" "+y};
const mshort=k=>{const[y,m]=k.split("-");return new Date(+y,+m-1,1).toLocaleDateString("pt-BR",{month:"short"}).replace(".","")+"/"+y.slice(2)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){let el=$("toast");if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el)}
  el.textContent=t;el.style.opacity="1";clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity="0",2200)}
function openSheet(html){$("sheet").innerHTML=html;$("sheetBg").classList.add("on");setTimeout(()=>{const f=$("sheet").querySelector("input,select");f&&f.focus()},80)}
function closeSheet(){$("sheetBg").classList.remove("on")}
function confirma(btn,msg){
  if(btn.dataset.armed==="1"){delete btn.dataset.armed;return true}
  btn.dataset.armed="1"; btn.dataset.txt=btn.innerHTML;
  btn.classList.add("armed"); btn.innerHTML="Toca de novo pra apagar";
  toast(msg);
  clearTimeout(btn._t); btn._t=setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.innerHTML=btn.dataset.txt;btn.classList.remove("armed")}},3500);
  return false;
}
const ICONS=[
  [/academia|gym|pilates|cross ?fit/i,"🏋️"],[/mercado|supermercado|feira/i,"🛒"],
  [/gasolina|combust[ií]vel|posto/i,"⛽"],[/carro|uber|99|transporte|passagem|[oô]nibus/i,"🚗"],
  [/farm[aá]cia|rem[eé]dio|sa[uú]de/i,"💊"],[/psic[oó]log/i,"🧠"],
  [/netflix|spotify|icloud|chatgpt|assinatura|streaming|plano|claro|tim|vivo/i,"📱"],
  [/presente/i,"🎁"],[/lanche|restaurante|ifood|comida|alimenta/i,"🍔"],
  [/sal[aá]rio|freela|pens[aã]o|venda|receber/i,"💰"],[/aluguel|condom[ií]nio|casa|[aá]gua|luz|internet/i,"🏠"],
  [/roupa|brech[oó]|garimpo/i,"🛍️"],[/faculdade|curso/i,"🎓"],[/organiza[cç][aã]o/i,"🤝"],
  [/atra[cç][oõ]|fotografia|videomaker|designer|divulga|decora/i,"🎪"],[/material|insumo|embalagem/i,"📦"]
];
function iconFor(cat,tipo){for(const[r,e]of ICONS)if(r.test(cat||""))return e;return tipo==="in"?"💵":"🧾"}
const CAT_SAIDA=["Mercado","Aluguel","Água/Luz/Internet","Academia","Assinatura","Transporte","Farmácia","Psicóloga","Lazer","Presente","Outro"];
const CAT_ENTRADA=["Salário","Freela","Pensão","Venda","Outra"];
const CAT_BERGA=["Organização","Atrações","Fotografia","Videomaker","Designer","Materiais","Brindes","Impressão","Decoração","Aluguel/Estrutura","Divulgação","Outro"];
const datalistCats=(list)=>'<datalist id="dlc">'+list.map(c=>'<option value="'+esc(c)+'">').join("")+'</datalist>';

/* ================= ESTADO ================= */
const DEFAULTS={v:1,contas:[],cartoes:[],entradasPessoal:[],saidasPessoal:[],edicoesBerga:[],entradasBerga:[],saidasBerga:[],
  brGarimpos:[],brEmbalagens:[],brEventos:[],brInsumos:[]};
let S=structuredClone(DEFAULTS);
let tab="inicio", filtroGasto="todos", edicaoAtual=null, eventoAtual=null, cartaoAtual=null;
function merge(o){ if(!o||typeof o!=="object")return; S=Object.assign(structuredClone(DEFAULTS),o);
  Object.keys(DEFAULTS).forEach(k=>{if(Array.isArray(DEFAULTS[k])&&!Array.isArray(S[k]))S[k]=[]}); }

/* ================= CÁLCULOS ================= */
const saldoContas=()=>S.contas.reduce((s,c)=>s+(+c.saldo||0),0);
const entradasMes=(m=MES_HOJE)=>S.entradasPessoal.filter(e=>e.status==="recebido"&&e.data&&e.data.slice(0,7)===m).reduce((s,e)=>s+(+e.valor||0),0);
const saidasMes=(m=MES_HOJE)=>S.saidasPessoal.filter(e=>e.status==="pago"&&e.data&&e.data.slice(0,7)===m).reduce((s,e)=>s+(+e.valor||0),0);
const aPagar=()=>S.saidasPessoal.filter(e=>e.status==="a_pagar").slice().sort((a,b)=>(a.data||"").localeCompare(b.data||""));
const aReceber=()=>S.entradasPessoal.filter(e=>e.status==="a_receber").slice().sort((a,b)=>(a.data||"").localeCompare(b.data||""));
const lucroBerga=(edId)=>{
  const ent=S.entradasBerga.filter(e=>e.edicaoId===edId).reduce((s,e)=>s+(+e.valorPago||0),0);
  const sai=S.saidasBerga.filter(e=>e.edicaoId===edId&&e.status==="pago").reduce((s,e)=>s+(+e.valor||0),0);
  return ent-sai;
};
const lucroEvento=(evId)=>{
  const ev=S.brEventos.find(e=>e.id===evId); if(!ev)return 0;
  return (+ev.valorArrecadado||0)-(+ev.valorInscricao||0)-(+ev.valorAlimentacao||0);
};

/* ================= RENDER ================= */
function render(){
  $("hello").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  document.querySelectorAll("nav.bn button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  document.querySelectorAll(".tab").forEach(d=>d.classList.toggle("on",d.id==="t-"+tab));
  if(tab==="inicio")$("t-inicio").innerHTML=rInicio();
  else if(tab==="gastos")$("t-gastos").innerHTML=rGastos();
  else if(tab==="cartoes")$("t-cartoes").innerHTML=rCartoes();
  else if(tab==="berga")$("t-berga").innerHTML=rBerga();
  else if(tab==="brecho")$("t-brecho").innerHTML=rBrecho();
  $("fab").style.display = tab==="inicio" ? "none" : "flex";
}

function rInicio(){
  const disp=saldoContas(), em=entradasMes(), sm=saidasMes();
  const pct=em>0?Math.max(0,Math.min(100,((em-sm)/em)*100)):100;
  const pend=aPagar(), totPend=pend.reduce((s,i)=>s+(+i.valor||0),0);
  const rec=aReceber();
  let h=`<div class="hero"><small>Disponível nas contas</small><div class="big num">${fmt.format(disp)}</div>
    <div class="hbar"><i style="width:${pct}%;background:#fff"></i></div>
    <div class="htiles"><div class="ht"><small>Ganhou em ${mfull(MES_HOJE)}</small><b class="num">${fmt.format(em)}</b></div>
    <div class="ht"><small>Gastou em ${mfull(MES_HOJE)}</small><b class="num">${fmt.format(sm)}</b></div></div></div>`;

  h+=`<div class="tiles"><div class="tile"><div class="ic" style="background:var(--bad-bg);color:var(--bad)">⏳</div>
      <b class="num">${fmt.format(totPend)}</b><div class="sub2">${pend.length} a pagar</div></div>
      <div class="tile"><div class="ic" style="background:var(--violet-bg);color:var(--violet)">📈</div>
      <b class="num">${fmt.format(disp-totPend)}</b><div class="sub2">sobra se pagar tudo</div></div></div>`;

  h+='<h2>A pagar</h2><div class="card">';
  h+= pend.length ? pend.map(e=>itemRow(e,"saidasPessoal",true)).join("") : '<div class="empty">Nada a pagar. 🎉</div>';
  h+='</div>';

  if(rec.length){
    h+='<h2>A receber</h2><div class="card">';
    h+=rec.map(e=>itemRow(e,"entradasPessoal",true)).join("");
    h+='</div>';
  }
  return h;
}

function itemRow(e,tabela,comCheck){
  const tipo=tabela.startsWith("entradas")?"in":"out";
  const pago=e.status==="pago"||e.status==="recebido";
  const checkHtml = comCheck ? `<button class="check${pago?" on":""}" data-act="pagar" data-t="${tabela}" data-id="${e.id}">✓</button>` : `<div class="dot" style="background:${tipo==="in"?"var(--mint-bg)":"var(--bad-bg)"};color:${tipo==="in"?"var(--mint)":"var(--bad)"}">${iconFor(e.categoria,tipo)}</div>`;
  const stamp = pago && comCheck ? '<span class="stamp">'+(tipo==="in"?"recebido":"pago")+'</span>' : '';
  return `<div class="item${pago?" pago":""}">${checkHtml}
    <div class="tx" data-act="editar" data-t="${tabela}" data-id="${e.id}"><div>${esc(e.categoria)}${stamp}</div><small>${dBR(e.data)}${e.fixo?" · fixo":""}${e.obs?" · "+esc(e.obs):""}</small></div>
    <div class="val num" style="color:${tipo==="in"?"var(--mint)":"var(--bad)"}">${fmt.format(e.valor)}</div>
    <button class="x" data-act="del" data-t="${tabela}" data-id="${e.id}">✕</button></div>`;
}

function rGastos(){
  let h='<div class="subtabs">'+
    ['entradas','saidas'].map(k=>`<button data-act="subg" data-v="${k}" aria-pressed="${filtroGasto.base===k}">${k==="entradas"?"Entradas":"Saídas"}</button>`).join("");
  h+='</div>';
  const base = (filtroGasto.base||filtroGasto)==="entradas" ? "entradas" : "saidas";
  if(base==="entradas"){
    h+='<div class="card">';
    const list=S.entradasPessoal.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    h+= list.length ? list.map(e=>itemRow(e,"entradasPessoal",true)).join("") : '<div class="empty">Nenhuma entrada ainda.</div>';
    h+='</div>';
  }else{
    const chips=[["todos","Todos"],["fixos","Fixos"],["futuros","Futuros"],["pago","Pagos"]];
    h+='<div class="subtabs">'+chips.map(([k,l])=>`<button data-act="chipg" data-v="${k}" aria-pressed="${(filtroGasto.chip||"todos")===k}">${l}</button>`).join("")+'</div>';
    const chip=filtroGasto.chip||"todos";
    let list=S.saidasPessoal.slice();
    if(chip==="fixos")list=list.filter(e=>e.fixo);
    else if(chip==="futuros")list=list.filter(e=>e.status==="a_pagar"&&e.data>HOJE);
    else if(chip==="pago")list=list.filter(e=>e.status==="pago");
    list.sort((a,b)=>(a.data||"").localeCompare(b.data||""));
    const total=list.reduce((s,e)=>s+(+e.valor||0),0);
    h+=`<div class="card" style="padding:12px 16px;margin-bottom:10px"><b class="num">${fmt.format(total)}</b> <span class="muted">em ${list.length} item(ns)</span></div>`;
    h+='<div class="card">';
    h+= list.length ? list.map(e=>itemRow(e,"saidasPessoal",true)).join("") : '<div class="empty">Nada aqui.</div>';
    h+='</div>';
  }
  return h;
}

function rCartoes(){
  let h='<h2>Contas</h2><div class="ctgrid">';
  const paleta=["var(--mint)","var(--violet)","var(--wine)","var(--amber)"];
  S.contas.forEach((c,i)=>{
    h+=`<div class="ctcard" style="background:${paleta[i%4]}" data-act="editar" data-t="contas" data-id="${c.id}">
      <button class="ed" data-act="del" data-t="contas" data-id="${c.id}" onclick="event.stopPropagation()">✕</button>
      <div class="nm"><i></i>${esc(c.nome)}</div><b class="num">${fmt.format(c.saldo)}</b></div>`;
  });
  h+='</div><button class="btn ghost full" data-act="novaConta">+ Nova conta</button>';

  h+='<h2>Cartões de crédito</h2>';
  if(!S.cartoes.length)h+='<div class="card"><div class="empty">Nenhum cartão cadastrado.</div></div>';
  S.cartoes.forEach(c=>{
    const meses=Object.keys(c.faturas||{}).sort();
    const atual=c.faturas&&c.faturas[MES_HOJE]!==undefined ? c.faturas[MES_HOJE] : null;
    const pctLivre = c.limite>0 && atual!==null ? Math.max(0,Math.min(100,((c.limite-atual)/c.limite)*100)) : 100;
    h+=`<div class="fatcard"><div class="ft"><div><small>${esc(c.nome)}</small><div class="fv num">${atual!==null?fmt.format(atual):fmt.format(0)}</div></div>
      <button class="x" style="color:#fff" data-act="editar" data-t="cartoes" data-id="${c.id}">✎</button></div>
      <div class="hbar"><i style="width:${pctLivre}%;background:#fff"></i></div>
      <div class="fchips"><div><small>Fatura de</small><b>${mfull(MES_HOJE)}</b></div><div><small>Limite</small><b class="num">${fmt.format(c.limite)}</b></div></div>`;
    if(meses.length){
      h+='<div class="fmini">'+meses.map(m=>`<button data-act="mesFat" data-t="${c.id}" data-v="${m}" aria-pressed="${m===MES_HOJE}">${mshort(m)}</button>`).join("")+'</div>';
    }
    h+=`<button class="btn ghost full" style="margin-top:8px;color:#fff;border-color:rgba(255,255,255,.3)" data-act="novaFatura" data-t="${c.id}">+ Lançar fatura do mês</button>
      <button class="x" style="color:#fff;opacity:.6;margin-top:6px" data-act="del" data-t="cartoes" data-id="${c.id}">✕ excluir cartão</button></div>`;
  });
  h+='<button class="btn ghost full" data-act="novoCartao">+ Novo cartão</button>';
  return h;
}

function rBerga(){
  if(!S.edicoesBerga.length)return '<div class="card"><div class="empty">Nenhuma edição da feira cadastrada ainda.</div></div><button class="btn full" data-act="novaEdicao">+ Nova edição</button>';
  if(!edicaoAtual || !S.edicoesBerga.some(e=>e.id===edicaoAtual)) edicaoAtual=S.edicoesBerga[S.edicoesBerga.length-1].id;
  const ed=S.edicoesBerga.find(e=>e.id===edicaoAtual);
  const lucro=lucroBerga(edicaoAtual);
  let h=`<div class="subtabs">${S.edicoesBerga.map(e=>`<button data-act="setEd" data-v="${e.id}" aria-pressed="${e.id===edicaoAtual}">${esc(e.nome.slice(0,16))}</button>`).join("")}</div>`;
  h+=`<div class="hero berga"><small>Lucro da edição</small><div class="big num">${fmt.format(lucro)}</div><small>${esc(ed.nome)} · ${dBR(ed.data)}</small></div>`;
  h+='<div class="subtabs">'+['entradas','saidas'].map(k=>`<button data-act="subb" data-v="${k}" aria-pressed="${(filtroGasto.berga||'entradas')===k}">${k==="entradas"?"Entradas":"Saídas"}</button>`).join("")+'</div>';
  const base=filtroGasto.berga||"entradas";
  if(base==="entradas"){
    const list=S.entradasBerga.filter(e=>e.edicaoId===edicaoAtual);
    h+='<div class="card">'+(list.length?list.map(e=>`<div class="item"><div class="dot" style="background:var(--mint-bg);color:var(--mint)">🏪</div>
      <div class="tx" data-act="editar" data-t="entradasBerga" data-id="${e.id}"><div>${esc(e.marca)}</div><small>${dBR(e.data)} · ${esc(e.forma||"")}${(+e.valorTotal||0)>(+e.valorPago||0)?" · falta "+fmt.format(e.valorTotal-e.valorPago):""}</small></div>
      <div class="val num" style="color:var(--mint)">${fmt.format(e.valorPago)}</div>
      <button class="x" data-act="del" data-t="entradasBerga" data-id="${e.id}">✕</button></div>`).join(""):'<div class="empty">Nenhuma marca lançada.</div>')+'</div>';
    h+='<button class="btn ghost full" data-act="novaEntradaBerga">+ Nova marca</button>';
  }else{
    const list=S.saidasBerga.filter(e=>e.edicaoId===edicaoAtual);
    h+='<div class="card">'+(list.length?list.map(e=>itemRow({...e},"saidasBerga",true)).join(""):'<div class="empty">Nenhuma saída lançada.</div>')+'</div>';
    h+='<button class="btn ghost full" data-act="novaSaidaBerga">+ Nova saída</button>';
  }
  h+='<button class="btn ghost full" style="margin-top:10px" data-act="novaEdicao">+ Nova edição</button>';
  return h;
}

function rBrecho(){
  const totalGarimpo=S.brGarimpos.reduce((s,g)=>s+(+g.valorGarimpo||0)+(+g.valorTransporte||0),0);
  const totalEmbalagem=S.brEmbalagens.reduce((s,e)=>s+(+e.valor||0),0);
  const totalArrecadado=S.brEventos.reduce((s,e)=>s+(+e.valorArrecadado||0),0);
  const lucro=totalArrecadado-totalGarimpo-totalEmbalagem-S.brEventos.reduce((s,e)=>s+(+e.valorInscricao||0)+(+e.valorAlimentacao||0),0);
  let h=`<div class="hero brecho"><small>Lucro do brechó (geral)</small><div class="big num">${fmt.format(lucro)}</div></div>`;
  h+='<div class="subtabs">'+[["garimpos","Garimpos"],["embalagens","Embalagens"],["eventos","Eventos"],["insumos","Insumos"]].map(([k,l])=>`<button data-act="subbr" data-v="${k}" aria-pressed="${(filtroGasto.brecho||'eventos')===k}">${l}</button>`).join("")+'</div>';
  const base=filtroGasto.brecho||"eventos";
  if(base==="garimpos"){
    h+='<button class="btn ghost full" data-act="novoGarimpo">+ Novo garimpo</button><div class="card" style="margin-top:10px">';
    h+= S.brGarimpos.length ? S.brGarimpos.map(g=>`<div class="item"><div class="dot" style="background:var(--wine-bg);color:var(--wine)">🛍️</div>
      <div class="tx" data-act="editar" data-t="brGarimpos" data-id="${g.id}"><div>${g.qtdPecas} peça(s)</div><small>${dBR(g.data)} · garimpo ${fmt.format(g.valorGarimpo)} + transporte ${fmt.format(g.valorTransporte)}</small></div>
      <div class="val num">${fmt.format((+g.valorGarimpo||0)+(+g.valorTransporte||0))}</div>
      <button class="x" data-act="del" data-t="brGarimpos" data-id="${g.id}">✕</button></div>`).join("") : '<div class="empty">Nenhum garimpo lançado.</div>';
    h+='</div>';
  }else if(base==="embalagens"){
    h+='<button class="btn ghost full" data-act="novaEmbalagem">+ Nova embalagem</button><div class="card" style="margin-top:10px">';
    h+= S.brEmbalagens.length ? S.brEmbalagens.map(e=>`<div class="item"><div class="dot" style="background:var(--wine-bg);color:var(--wine)">📦</div>
      <div class="tx" data-act="editar" data-t="brEmbalagens" data-id="${e.id}"><div>${e.qtd} unid.</div><small>${dBR(e.data)}${e.obs?" · "+esc(e.obs):""}</small></div>
      <div class="val num">${fmt.format(e.valor)}</div><button class="x" data-act="del" data-t="brEmbalagens" data-id="${e.id}">✕</button></div>`).join("") : '<div class="empty">Nenhuma embalagem lançada.</div>';
    h+='</div>';
  }else if(base==="eventos"){
    h+='<button class="btn ghost full" data-act="novoEvento">+ Novo evento</button><div class="card" style="margin-top:10px">';
    h+= S.brEventos.length ? S.brEventos.map(ev=>`<div class="item"><div class="dot" style="background:var(--wine-bg);color:var(--wine)">🎪</div>
      <div class="tx" data-act="editar" data-t="brEventos" data-id="${ev.id}"><div>${esc(ev.nome)}</div><small>${dBR(ev.data)} · lucro ${fmt.format(lucroEvento(ev.id))}</small></div>
      <div class="val num">${fmt.format(ev.valorArrecadado)}</div><button class="x" data-act="del" data-t="brEventos" data-id="${ev.id}">✕</button></div>`).join("") : '<div class="empty">Nenhum evento lançado.</div>';
    h+='</div>';
  }else{
    h+='<button class="btn ghost full" data-act="novoInsumo">+ Novo insumo</button><div class="card" style="margin-top:10px">';

/* ================= AÇÕES ================= */
function commit(){render();queueSave()}
function findRec(t,id){return (S[t]||[]).find(x=>String(x.id)===String(id))}

document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act],[data-tab]"); if(!b)return;
  const a=b.dataset.act;
  if(b.dataset.tab && !a){ tab=b.dataset.tab; render(); return; }
  if(a==="fechar"){ closeSheet(); return; }
  if(a==="sair"){ closeSheet(); sb.auth.signOut(); location.reload(); return; }
  if(a==="ajustes"){ openSheet(sheetAjustes()); return; }
  if(a==="fab"){
    if(tab==="gastos"){ const base=(filtroGasto.base||filtroGasto); if(base==="entradas")openSheet(sheetEntrada()); else openSheet(sheetGasto()); }
    else if(tab==="cartoes"){ openSheet(sheetConta()); }
    else if(tab==="berga"){ if(!S.edicoesBerga.length)openSheet(sheetEdicao()); else openSheet((filtroGasto.berga||"entradas")==="entradas"?sheetEntradaBerga():sheetSaidaBerga()); }
    else if(tab==="brecho"){ const base=filtroGasto.brecho||"eventos"; if(base==="garimpos")openSheet(sheetGarimpo()); else if(base==="embalagens")openSheet(sheetEmbalagem()); else if(base==="insumos")openSheet(sheetInsumo()); else openSheet(sheetEvento()); }
    return;
  }
  if(a==="subg"){ filtroGasto={base:b.dataset.v, chip:(filtroGasto.chip)}; render(); return; }
  if(a==="chipg"){ filtroGasto=Object.assign({},filtroGasto,{chip:b.dataset.v}); render(); return; }
  if(a==="subb"){ filtroGasto=Object.assign({},filtroGasto,{berga:b.dataset.v}); render(); return; }
  if(a==="subbr"){ filtroGasto=Object.assign({},filtroGasto,{brecho:b.dataset.v}); render(); return; }
  if(a==="setEd"){ edicaoAtual=b.dataset.v; render(); return; }
  if(a==="mesFat"){ cartaoAtual=b.dataset.t; MES_SEL=b.dataset.v; render(); return; }
  if(a==="novaConta"){ openSheet(sheetConta()); return; }
  if(a==="novoCartao"){ openSheet(sheetCartao()); return; }
  if(a==="novaFatura"){ openSheet(sheetFatura(b.dataset.t)); return; }
  if(a==="novaEdicao"){ openSheet(sheetEdicao()); return; }
  if(a==="novaEntradaBerga"){ openSheet(sheetEntradaBerga()); return; }
  if(a==="novaSaidaBerga"){ openSheet(sheetSaidaBerga()); return; }
  if(a==="novoGarimpo"){ openSheet(sheetGarimpo()); return; }
  if(a==="novaEmbalagem"){ openSheet(sheetEmbalagem()); return; }
  if(a==="novoEvento"){ openSheet(sheetEvento()); return; }
  if(a==="novoInsumo"){ openSheet(sheetInsumo()); return; }
  if(a==="editar"){
    const t=b.dataset.t, rec=findRec(t,b.dataset.id); if(!rec)return;
    const fns={entradasPessoal:sheetEntrada,saidasPessoal:sheetGasto,contas:sheetConta,cartoes:sheetCartao,
      edicoesBerga:sheetEdicao,entradasBerga:sheetEntradaBerga,saidasBerga:sheetSaidaBerga,
      brGarimpos:sheetGarimpo,brEmbalagens:sheetEmbalagem,brEventos:sheetEvento,brInsumos:sheetInsumo};
    if(fns[t]) openSheet(fns[t](rec));
    return;
  }
  if(a==="del"){
    if(!confirma(b,"Toca de novo pra apagar"))return;
    const t=b.dataset.t, id=b.dataset.id;
    S[t]=S[t].filter(x=>String(x.id)!==String(id));
    closeSheet(); commit();
    return;
  }
  if(a==="pagar"){
    const t=b.dataset.t, rec=findRec(t,b.dataset.id); if(!rec)return;
    const isEntrada=t.startsWith("entradas");
    const paidVal=isEntrada?"recebido":"pago", pendVal=isEntrada?"a_receber":"a_pagar";
    rec.status = rec.status===paidVal ? pendVal : paidVal;
    commit();
    return;
  }
});

document.addEventListener("submit", e=>{
  const form=e.target.closest("form[data-form]"); if(!form)return;
  e.preventDefault();
  const t=form.dataset.form, editId=form.dataset.editId;
  const fd=new FormData(form);
  const g=k=>fd.get(k);
  let obj=null;
  if(t==="saidasPessoal") obj={valor:num(g("valor")),data:g("data"),categoria:g("categoria").trim(),fixo:g("fixo")==="on",status:g("status"),obs:g("obs")||""};
  else if(t==="entradasPessoal") obj={valor:num(g("valor")),data:g("data"),categoria:g("categoria").trim(),status:g("status"),obs:g("obs")||""};
  else if(t==="contas") obj={nome:g("nome").trim(),saldo:num(g("saldo"))};
  else if(t==="cartoes") obj={nome:g("nome").trim(),limite:num(g("limite")),faturas:editId?undefined:{}};
  else if(t==="edicoesBerga") obj={nome:g("nome").trim(),data:g("data")};
  else if(t==="entradasBerga") obj={marca:g("marca").trim(),valorTotal:num(g("valorTotal")),valorPago:num(g("valorPago")),forma:g("forma")||"",data:g("data"),edicaoId:editId?undefined:edicaoAtual};
  else if(t==="saidasBerga") obj={valor:num(g("valor")),data:g("data"),categoria:g("categoria").trim(),status:g("status"),obs:g("obs")||"",edicaoId:editId?undefined:edicaoAtual};
  else if(t==="brGarimpos") obj={valorGarimpo:num(g("valorGarimpo")),valorTransporte:num(g("valorTransporte")),qtdPecas:+g("qtdPecas")||0,data:g("data"),obs:g("obs")||""};
  else if(t==="brEmbalagens") obj={valor:num(g("valor")),qtd:+g("qtd")||0,data:g("data"),obs:g("obs")||""};
  else if(t==="brEventos") obj={nome:g("nome").trim(),data:g("data"),qtdVendida:+g("qtdVendida")||0,valorArrecadado:num(g("valorArrecadado")),valorInscricao:num(g("valorInscricao")),valorAlimentacao:num(g("valorAlimentacao")),obs:g("obs")||""};
  else if(t==="brInsumos") obj={nome:g("nome").trim(),qtd:+g("qtd")||0,obs:g("obs")||""};
  else if(t==="fatura"){
    const cId=form.dataset.cartao, c=S.cartoes.find(x=>x.id===cId);
    c.faturas=c.faturas||{}; c.faturas[g("mes")]=num(g("valor"));
    closeSheet(); commit(); return;
  }
  if(!obj)return;
  if(editId){ const rec=findRec(t,editId); Object.assign(rec,obj); }
  else { S[t].push(Object.assign({id:uid()},obj)); }
  closeSheet(); commit();
});

/* ===== máscara de dinheiro ===== */
const isMoney=el=>el&&el.matches&&el.matches('input[inputmode="decimal"]');
function maskMoney(el){
  const d=el.value.replace(/\D/g,"").replace(/^0+/,"").slice(0,12);
  el.value=d?(parseInt(d,10)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"";
  const n=el.value.length; try{el.setSelectionRange(n,n)}catch(e){}
}
document.addEventListener("input",e=>{if(isMoney(e.target))maskMoney(e.target)});
document.addEventListener("focusin",e=>{const el=e.target;if(!isMoney(el))return;el.dataset.prev=el.value;el.value=""});
document.addEventListener("focusout",e=>{const el=e.target;if(!isMoney(el))return;const prev=el.dataset.prev;
  if(el.value===""&&prev)el.value=prev; delete el.dataset.prev});

/* ================= SALVAR / OFFLINE ================= */
let saveT=null,lastSaved="",ready=false;
const setSave=t=>$("saveState").textContent=t;
function queueSave(){ if(!ready)return; clearTimeout(saveT); setSave("Salvando…"); saveT=setTimeout(()=>save(),600); }
const cacheKey=()=>"fin2-cache";
function guardarCache(pendente){ try{localStorage.setItem(cacheKey(),JSON.stringify({S,em:Date.now()})); if(pendente)localStorage.setItem("fin2-pendente","1")}catch(e){} }
function lerCache(){ try{return JSON.parse(localStorage.getItem(cacheKey())||"null")}catch(e){return null} }
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="127.0.0.1")) navigator.serviceWorker.register("sw.js").catch(()=>{});
render(); setSave("Carregando…");

save=async function(){
  saveT=null; const body=JSON.stringify(S);
  guardarCache(true);
  if(!navigator.onLine){ setSave("Sem internet · salvo no celular"); return; }
  let error=null; try{ ({error}=await sb.from("fin_plano").upsert({id:"casal",estado:S,atualizado_em:new Date().toISOString()},{onConflict:"id"})); }catch(e){ error=e; }
  if(error){ console.error(error);
    if(!navigator.onLine||String(error.message||error).match(/fetch|network|Load failed/i)){ setSave("Sem internet · salvo no celular"); return; }
    setSave("Entra de novo pra sincronizar"); window.sbMostrarLogin&&window.sbMostrarLogin(); return;
  }
  lastSaved=body; try{localStorage.removeItem("fin2-pendente")}catch(e){} setSave("Salvo");
};
let conectado=false, USER=null;
async function sincronizar(){
  if(conectado||!navigator.onLine)return;
  if(USER.offline){ let ses=null; try{({data:{session:ses}}=await sb.auth.getSession())}catch(e){}
    if(ses){USER=ses.user;SB_USER=ses.user} else { if(!ready)usarCache(); setSave("Entra de novo pra sincronizar"); window.sbMostrarLogin&&window.sbMostrarLogin(); return; } }
  let data,error; try{ ({data,error}=await sb.from("fin_plano").select("estado").eq("id","casal").maybeSingle()); }catch(e){ error=e; }
  if(error){ console.error(error); if(!ready)usarCache(); return; }
  const pend=(()=>{try{return localStorage.getItem("fin2-pendente")==="1"}catch(e){return false}})();
  const c=lerCache();
  if(pend&&c&&c.S){ merge(c.S); } else if(!(ready&&saveT)){ merge(data&&data.estado); }
  ready=true;
  if(pend||!data||!data.estado) await save(); else lastSaved=JSON.stringify(S);
  guardarCache(); render(); if(!saveT)setSave(pend?"Sincronizado ✓":"Salvo");
  conectado=true;
  sb.channel("fin2-casal")
    .on("postgres_changes",{event:"*",schema:"public",table:"fin_plano",filter:"id=eq.casal"},p=>{
      if(p.eventType==="DELETE"||saveT)return; const bNew=JSON.stringify(p.new.estado);
      if(bNew!==lastSaved && !document.activeElement.matches("input,select,textarea")){ merge(p.new.estado); lastSaved=JSON.stringify(S); render(); } })
    .subscribe();
}
function usarCache(){
  const c=lerCache(); ready=true;
  if(c&&c.S){ merge(c.S); lastSaved=""; }
  render(); setSave(c?"Sem internet · usando o que tá no celular":"Sem internet");
}
